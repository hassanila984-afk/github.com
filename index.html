<style>
:root{
  --void:#080403;--panel:#120806;--ink:#f7e8da;--dim:#b39985;--faint:#7d6555;--ember:#ff6a24;--gold:#ffc65e;
  --line:rgba(255,130,60,.2);--line-strong:rgba(255,140,70,.4);--ok:#7fd49a;--danger:#ff6b6b;
  --f-display:"Reem Kufi","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic",system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:radial-gradient(120% 80% at 50% 36%,rgba(70,30,6,.6),var(--void) 62%) fixed,var(--void);color:var(--ink);font-family:var(--f-body);overflow:hidden}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.app{height:100%;display:flex;flex-direction:column;max-width:760px;margin:0 auto;
  padding:calc(env(safe-area-inset-top,0px) + 10px) max(16px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 10px) max(16px,env(safe-area-inset-left,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex:none}
.top h1{margin:0;font:700 1.35rem var(--f-display);letter-spacing:.18em;color:#ffe9d4;text-shadow:0 0 18px rgba(255,106,36,.6)}
.icon-btn{width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:rgba(255,255,255,.03);color:var(--ink);cursor:pointer;display:grid;place-items:center}
.icon-btn svg{width:20px;height:20px}
.stage{flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:10px;padding-block:8px;text-align:center}
.seg{display:flex;gap:6px;justify-content:center;flex:none}
.seg button{font:500 .8rem var(--f-body);color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.4rem .85rem;cursor:pointer}
.seg button[aria-pressed="true"]{color:#1a0800;background:var(--gold);border-color:var(--gold)}
.holo{flex:none;border:0;padding:0;background:transparent;cursor:pointer;border-radius:50%;display:block;-webkit-tap-highlight-color:transparent}
.holo canvas{display:block}
.vstate{margin:0;font:500 1rem var(--f-display);color:var(--gold);text-shadow:0 0 14px rgba(255,140,40,.6);max-width:46ch;line-height:1.7}
.vlive{margin:0;color:var(--dim);font-size:.9rem;min-height:1.4em;max-width:46ch;line-height:1.7}
.vreply{max-width:56ch;width:100%;text-align:start;line-height:1.8;font-size:.95rem}
.vreply p{margin:0 0 .5rem}.vreply ul{margin:.25rem 0 .5rem;padding-inline-start:1.2rem}
.tools{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;padding-block:8px;flex:none}
.ghost{font:500 .75rem var(--f-body);color:var(--dim);background:transparent;border:1px solid var(--line);border-radius:999px;padding:.32rem .72rem;cursor:pointer;white-space:nowrap}
.toggle{display:flex;align-items:center;gap:6px;font:500 .75rem var(--f-body);color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:.32rem .72rem;cursor:pointer}
.toggle input{margin:0;accent-color:var(--ember)}
.composer{display:flex;gap:8px;align-items:flex-end;flex:none}
.composer textarea{flex:1;min-width:0;resize:none;max-height:120px;min-height:44px;font:400 .95rem/1.5 var(--f-body);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:14px;padding:.6rem .8rem}
.send{flex:none;height:44px;min-width:66px;padding:0 1rem;border:0;border-radius:14px;font:600 .9rem var(--f-body);color:#1a0800;background:linear-gradient(135deg,var(--gold),var(--ember));cursor:pointer}
.btn{font:600 .85rem var(--f-body);border-radius:12px;padding:.6rem 1rem;cursor:pointer;border:1px solid var(--line-strong);background:rgba(255,255,255,.03);color:var(--ink)}
.btn.primary{border:0;color:#1a0800;background:linear-gradient(135deg,var(--gold),var(--ember))}
.panel{position:fixed;inset:0;z-index:20;background:rgba(0,0,0,.55);display:grid;place-items:center;padding:16px}
.card{width:100%;max-width:480px;max-height:100%;overflow-y:auto;background:rgba(22,10,6,.97);border:1px solid var(--line-strong);border-radius:20px;padding:18px;display:grid;gap:12px;box-shadow:0 20px 60px rgba(255,80,20,.15)}
.card h2{margin:0;font:700 1.2rem var(--f-display)}
.card p{margin:0;color:var(--dim);font-size:.85rem;line-height:1.7}
.card label{display:grid;gap:6px;font:500 .8rem var(--f-body);color:var(--dim)}
.card input,.card textarea,.card select{width:100%;font:400 .92rem/1.6 var(--f-body);color:var(--ink);background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:.55rem .75rem}
.card option{background:#120806}
.card textarea{resize:vertical;min-height:90px}
.row{display:flex;gap:8px;align-items:flex-end;flex-wrap:wrap;justify-content:space-between}
.row label{flex:1;min-width:0}
.status{color:var(--dim);font-size:.8rem}
.start{position:fixed;inset:0;z-index:15;display:grid;place-items:center;background:rgba(8,4,3,.55);cursor:pointer;border:0;color:var(--ink);font:500 1.05rem var(--f-display);width:100%}
.start span{padding:.8rem 1.4rem;border:1px solid var(--line-strong);border-radius:999px;background:rgba(22,10,6,.85);box-shadow:0 0 30px rgba(255,106,36,.3)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom,0px) + 80px);z-index:40;background:#2a150a;border:1px solid var(--line-strong);color:var(--ink);padding:.55rem 1rem;border-radius:999px;font-size:.82rem;max-width:calc(100% - 32px);text-align:center}
</style>
</head>
<body>

  <header class="top">

  </header>
  <main class="stage">
    <div class="seg" id="vLang" role="group" aria-label="لغة الحچي"><button type="button" data-l="ar">أحچي عربي</button><button type="button" data-l="en">I speak English</button></div>
    <button class="holo" id="vOrb" type="button" aria-label="جارفس"><canvas id="vHolo"></canvas></button>

    <label class="toggle"><input type="checkbox" id="vLoop" checked>محادثة مستمرة</label>
    <button class="ghost" type="button" id="vMute">الصوت: شغّال</button>
    <button class="ghost" type="button" id="vNew">محادثة جديدة</button>
  </div>
  <form class="composer" id="vForm">
    <textarea id="vInp" dir="auto" rows="1" placeholder="أو اكتب هنا…"></textarea>
    <button class="send" type="submit">إرسال</button>
  </form>
</div>

<button class="start" id="startBtn" type="button" hidden><span>اضغط حتى يصحى جارفس · Tap to wake Jarvis</span></button>

<div class="panel" id="setPanel" hidden>
  <form class="card" id="setForm">
    <h2>إعدادات جارفس</h2>
    <p>جارفس يوصل لـClaude عن طريق الـrelay مالتك بـGoogle Apps Script. الخطوات بملف README.md بنفس المجلد.</p>
    <label>رابط الـrelay (Web app URL)<input id="sUrl" dir="ltr" placeholder="https://script.google.com/macros/s/…/exec" required></label>
    <label>كلمة السر (PASSCODE)<input id="sPass" dir="ltr" type="password" autocomplete="off" required></label>
    <label>عنك (جارفس يقراها قبل كل جواب)<textarea id="sAbout" dir="auto" placeholder="مثلاً: اسمي حسن، أشتغل سوشيال ميديا وكوبي رايتر وميديا باير بالعراق. البراندات اللي أشتغل عليها…"></textarea></label>
    <div class="row"><label>صوت جارفس بالعربي<select id="vSel-ar"></select></label><button class="ghost" type="button" data-test="ar">جرّب</button></div>
    <div class="row"><label>Jarvis's English voice<select id="vSel-en"></select></label><button class="ghost" type="button" data-test="en">Test</button></div>
    <div class="row"><span class="status" id="sStatus"></span><span style="display:flex;gap:8px"><button class="btn" type="button" id="sCheck">افحص الاتصال</button><button class="btn primary" type="submit">حفظ</button></span></div>
  </form>
</div>

<div class="toast" id="toast" hidden></div>

<script>
const $=s=>document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));}
function md(s){
  const lines=esc(s).split(/\n/);let out="",inList=false;
  for(let l of lines){
    l=l.replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/^\s*#{1,4}\s+(.+)$/,"<b>$1</b>");
    if(/^\s*([-*•]|\d+[.)])\s+/.test(l)){if(!inList){out+="<ul>";inList=true;}out+="<li>"+l.replace(/^\s*([-*•]|\d+[.)])\s+/,"")+"</li>";continue;}
    if(inList){out+="</ul>";inList=false;}
    if(l.trim())out+="<p dir=\"auto\">"+l+"</p>";
  }
  if(inList)out+="</ul>";return out;
}
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3000);}
function seeded(str){let h=1779033703^str.length;for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=h<<13|h>>>19;}return function(){h=Math.imul(h^h>>>16,2246822507);h=Math.imul(h^h>>>13,3266489909);h^=h>>>16;return (h>>>0)/4294967296;};}

/* =========================================================
   STATE
   ========================================================= */
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
const LS={get(k){try{return localStorage.getItem(k);}catch(e){return null;}},set(k,v){try{localStorage.setItem(k,v);}catch(e){}}};
const CFG={url:LS.get("jv-url")||"",pass:LS.get("jv-pass")||"",about:LS.get("jv-about")||""};
let HIST=[];try{HIST=JSON.parse(LS.get("jv-hist")||"[]").filter(t=>t&&typeof t.content==="string"&&(t.role==="user"||t.role==="assistant"));}catch(e){HIST=[];}
const saveHist=()=>LS.set("jv-hist",JSON.stringify(HIST.slice(-40)));
const V={rec:null,state:"idle",ctl:null,muted:false,spk:0,err:null,unlocked:false,
  lang:LS.get("jv-lang")==="en"?"en":"ar",voices:{ar:null,en:null},warned:{},q:[],said:0,gen:false,talking:false,srAr:"ar-IQ",
  mode:"off",misses:0,wakeFails:0,wakeAt:0,after:null,micBlocked:false,started:false};
const WAKE_RE=/(جارف[سص]|جارفيس|جاروس|جافيس|جارڤس|jarvis|jervis|jarvas)/i;
const isAr=s=>{const a=(String(s).match(/[؀-ۿ]/g)||[]).length,l=(String(s).match(/[A-Za-z]/g)||[]).length;return a||l?a*2>=l:V.lang==="ar";};
const voiceOpen=()=>true;

function systemPrompt(){
  const d=new Date();
  return `You are JARVIS, the personal AI assistant of Hero (Hassan), who works in social media, copywriting and media buying in Iraq. You are calm, intelligent, polite, with a light dry wit, like JARVIS from Iron Man. Today is ${d.toDateString()}.
This is a voice conversation: everything you write is read aloud.
- Always answer in the same language as Hero's latest message. English: natural, slightly British English. Arabic: white Iraqi dialect (اللهجة العراقية البيضاء). Mixed: the dominant language.
- Short, natural spoken sentences. No markdown, lists, headings, links or emoji. At most 4 sentences unless Hero asks for detail.
- If an important detail is missing, ask one short question. Never invent facts, numbers or events.
Notes Hero wrote about themself and their work:
${CFG.about.trim()||"(none yet)"}`;
}
</script>
<script>
/* ---------- hologram (canvas 2D, drawn only while the voice screen is open) ---------- */
const H={cv:null,ctx:null,s:0,dpr:1,E:.2,bump:0,run:false,last:0,t:0,ry:0,traces:[],arcs:[],panels:[],sparks:[]};
const H_REDUCE=matchMedia("(prefers-reduced-motion: reduce)").matches;
function holoBump(x){if(!H_REDUCE)H.bump=Math.min(.7,H.bump+x);}
function holoBuild(){
  const rnd=seeded("jarvis-holo");
  const sph=(la,lo,r)=>[r*Math.cos(la)*Math.sin(lo),r*Math.sin(la),r*Math.cos(la)*Math.cos(lo)];
  for(let i=0;i<150;i++){
    let la=(rnd()*2-1)*1.2,lo=rnd()*6.283;const r=[.6,.76,.9,1][i%4];const pts=[sph(la,lo,r)];
    const steps=3+Math.floor(rnd()*5);
    for(let k=0;k<steps;k++){
      const dla=k%2?0:(rnd()*2-1)*.28,dlo=k%2?(rnd()*2-1)*.4:0;
      for(let j=1;j<=4;j++)pts.push(sph(Math.max(-1.4,Math.min(1.4,la+dla*j/4)),lo+dlo*j/4,r));
      la=Math.max(-1.4,Math.min(1.4,la+dla));lo+=dlo;
    }
    H.traces.push({pts,pad:rnd()<.5,thick:rnd()<.15});
  }
  for(let i=0;i<16;i++){
    const ax=rnd()*Math.PI,az=(rnd()*2-1)*1.2;
    H.arcs.push({r:.32+rnd()*.78,start:rnd()*6.283,len:.6+rnd()*3.8,w:rnd()<.3?2.6:1.1,spd:(rnd()*2-1)*.6,dash:rnd()<.35,ca:Math.cos(ax),sa:Math.sin(ax),cz:Math.cos(az),sz:Math.sin(az)});
  }
  for(let i=0;i<40;i++){
    const la=(rnd()*2-1)*1.1,lo=rnd()*6.283,r=.84+rnd()*.2,h=.03+rnd()*.05,w=.04+rnd()*.09;
    H.panels.push([sph(la-h,lo-w,r),sph(la-h,lo+w,r),sph(la+h,lo+w,r),sph(la+h,lo-w,r)]);
  }
  for(let i=0;i<260;i++){
    let v=[rnd()*2-1,rnd()*2-1,rnd()*2-1];const n=Math.hypot(...v)||1;const r=.25+.85*Math.pow(rnd(),.6);
    H.sparks.push({p:v.map(x=>x/n*r),ph:rnd()*6.283,f:1+rnd()*3});
  }
}
function holoSize(){
  const s=Math.round(Math.max(160,Math.min(innerWidth*.86,innerHeight*.46,440))),dpr=Math.min(2,devicePixelRatio||1);
  H.s=s;H.dpr=dpr;H.cv.width=s*dpr;H.cv.height=s*dpr;H.cv.style.width=H.cv.style.height=s+"px";
}
function holoStart(){
  if(!H.cv){H.cv=$("#vHolo");H.ctx=H.cv.getContext("2d");if(!H.ctx)return;holoBuild();addEventListener("resize",()=>{if(H.run)holoSize();});}
  holoSize();
  if(!H.run){H.run=true;H.last=performance.now();requestAnimationFrame(holoFrame);}
}
function holoFrame(now){
  if(!voiceOpen()){H.run=false;return;}
  requestAnimationFrame(holoFrame);
  const dt=Math.min(50,now-H.last)/1000;H.last=now;H.t+=dt;
  const st=V.state,tgt={idle:.22,listening:.38,thinking:.6,speaking:.5,standby:.05}[st]??.2;
  H.bump*=Math.pow(.05,dt);H.E+=(tgt+H.bump-H.E)*Math.min(1,dt*5);
  const E=H.E,mult=st==="standby"?.5:1,lum=(.55+.6*E)*mult;
  H.ry+=dt*(H_REDUCE?.04:(.12+E*.5+(st==="thinking"?.9:0)));
  const ctx=H.ctx,s=H.s,c=s/2,R=s*.43*(1+.04*E);
  ctx.setTransform(H.dpr,0,0,H.dpr,0,0);ctx.globalCompositeOperation="source-over";ctx.clearRect(0,0,s,s);
  ctx.globalCompositeOperation="lighter";ctx.lineCap="round";ctx.lineJoin="round";
  const rx=.38+.08*Math.sin(H.t*.3),cr=Math.cos(H.ry),sr=Math.sin(H.ry),cx=Math.cos(rx),sx=Math.sin(rx);
  const P=p=>{const x=p[0]*cr+p[2]*sr,z0=-p[0]*sr+p[2]*cr;return [c+x*R,c-(p[1]*cx-z0*sx)*R,p[1]*sx+z0*cx];};
  const G2=Math.round(170+50*E),B2=Math.round(60+50*E);
  const gold=a=>`rgba(255,${G2},${B2},${Math.max(0,Math.min(1,a)).toFixed(3)})`;
  const depth=z=>.2+.8*(z+1)/2;
  // halo
  let g=ctx.createRadialGradient(c,c,0,c,c,R*1.2);g.addColorStop(0,`rgba(255,150,40,${(.16*lum).toFixed(3)})`);g.addColorStop(.55,`rgba(255,110,25,${(.06*lum).toFixed(3)})`);g.addColorStop(1,"rgba(255,90,20,0)");
  ctx.fillStyle=g;ctx.fillRect(0,0,s,s);
  // circuit traces on the sphere, batched by depth
  const tb=[0,1,2,3].map(()=>new Path2D()),kb=[0,1,2,3].map(()=>new Path2D()),pb=[0,1,2,3].map(()=>new Path2D());
  for(const tr of H.traces){
    const pr=tr.pts.map(P),b=Math.min(3,Math.floor((pr[pr.length>>1][2]+1)/2*4)),path=tr.thick?kb[b]:tb[b];
    path.moveTo(pr[0][0],pr[0][1]);for(let i=1;i<pr.length;i++)path.lineTo(pr[i][0],pr[i][1]);
    if(tr.pad){const e=pr[pr.length-1];pb[b].moveTo(e[0]+1.6,e[1]);pb[b].arc(e[0],e[1],1.6,0,6.283);}
  }
  for(let b=0;b<4;b++){
    const a=(.1+.24*b)*lum;
    ctx.strokeStyle=gold(a*.25);ctx.lineWidth=3;ctx.stroke(kb[b]);
    ctx.strokeStyle=gold(a);ctx.lineWidth=.8;ctx.stroke(tb[b]);ctx.lineWidth=1.6;ctx.stroke(kb[b]);
    ctx.fillStyle=gold(a*1.2);ctx.fill(pb[b]);
  }
  // data panels
  const nb=[0,1,2].map(()=>new Path2D());
  for(const pn of H.panels){const pr=pn.map(P),b=Math.min(2,Math.floor((pr[0][2]+1)/2*3));nb[b].moveTo(pr[0][0],pr[0][1]);for(let i=1;i<4;i++)nb[b].lineTo(pr[i][0],pr[i][1]);nb[b].closePath();}
  for(let b=0;b<3;b++){const a=(.12+.3*b)*lum;ctx.fillStyle=gold(a*.18);ctx.fill(nb[b]);ctx.strokeStyle=gold(a);ctx.lineWidth=.7;ctx.stroke(nb[b]);}
  // orbit rings
  const spinK=1+E*2+(st==="thinking"?2:0);
  for(const a of H.arcs){
    const a0=a.start+H.t*a.spd*spinK,N=40,pts=[];
    for(let i=0;i<=N;i++){const th=a0+a.len*i/N,x=a.r*Math.cos(th),y0=a.r*Math.sin(th),y=y0*a.ca,z=y0*a.sa;pts.push(P([x*a.cz-y*a.sz,x*a.sz+y*a.cz,z]));}
    for(let k=0;k<N;k+=8){
      if(a.dash&&(k/8)%2)continue;
      const al=depth(pts[Math.min(N,k+4)][2])*.75*lum;
      ctx.beginPath();ctx.moveTo(pts[k][0],pts[k][1]);for(let i=k+1;i<=Math.min(N,k+8);i++)ctx.lineTo(pts[i][0],pts[i][1]);
      ctx.strokeStyle=gold(al*.14);ctx.lineWidth=a.w*3.5;ctx.stroke();
      ctx.strokeStyle=gold(al);ctx.lineWidth=a.w;ctx.stroke();
    }
  }
  // sparks
  const sb=[0,1,2].map(()=>[]);
  for(const sp of H.sparks){
    const k=1+.1*E*Math.sin(H.t*2+sp.ph),pr=P([sp.p[0]*k,sp.p[1]*k,sp.p[2]*k]);
    const a=depth(pr[2])*(.5+.5*Math.sin(H.t*sp.f+sp.ph));sb[a>.66?2:a>.33?1:0].push(pr);
  }
  sb.forEach((arr,i)=>{ctx.fillStyle=gold((.3+.35*i)*lum);for(const p of arr)ctx.fillRect(p[0]-.9,p[1]-.9,1.8,1.8);});
  // core: glow, ring and the turning spiral
  g=ctx.createRadialGradient(c,c,0,c,c,R*.32);g.addColorStop(0,`rgba(255,230,170,${(.5*lum).toFixed(3)})`);g.addColorStop(.4,`rgba(255,160,50,${(.18*lum).toFixed(3)})`);g.addColorStop(1,"rgba(255,120,30,0)");
  ctx.fillStyle=g;ctx.beginPath();ctx.arc(c,c,R*.32,0,6.283);ctx.fill();
  ctx.strokeStyle=gold(.85*lum);ctx.lineWidth=2.2;ctx.beginPath();ctx.arc(c,c,R*.1,0,6.283);ctx.stroke();
  const t0=H.t*(1.1+E*2);
  ctx.lineWidth=1.4;ctx.beginPath();ctx.arc(c,c,R*.06,t0*1.7,t0*1.7+4);ctx.stroke();
  for(let ch=0;ch<6;ch++){
    ctx.beginPath();
    for(let k=ch*10;k<=ch*10+10;k++){const f=k/60,ang=t0+f*5.2,rad=R*(.1+.42*f),x=c+Math.cos(ang)*rad,y=c+Math.sin(ang)*rad*.92;k===ch*10?ctx.moveTo(x,y):ctx.lineTo(x,y);}
    const f=(ch*10+5)/60;ctx.strokeStyle=gold((1-f)*.75*lum);ctx.lineWidth=3*(1-f)+.8;ctx.stroke();
  }
  ctx.setLineDash([4,7]);ctx.lineDashOffset=-H.t*30;ctx.strokeStyle=gold(.45*lum);ctx.lineWidth=1.2;
  ctx.beginPath();ctx.arc(c,c,R*.2,0,6.283);ctx.stroke();ctx.setLineDash([]);
  // listening: breathing rim and ripples
  if(st==="listening"){
    ctx.strokeStyle=gold(.5);ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(c,c,R*(1.07+.025*Math.sin(H.t*4)),0,6.283);ctx.stroke();
    const fr=(H.t*.8)%1;ctx.strokeStyle=gold(.4*(1-fr));ctx.lineWidth=1;ctx.beginPath();ctx.arc(c,c,R*(1+fr*.14),0,6.283);ctx.stroke();
  }
}


/* ---------- voices: prefer natural/neural, a calm male voice, British English and Iraqi/Saudi Arabic ---------- */
const V_MALE={ar:/maged|majed|hamed|naayf|shakir|bassel|omar|fahed|tarik|hamdan|rami|male/i,en:/daniel|arthur|ryan|thomas|guy|christopher|eric|brian|oliver|george|aaron|andrew|liam|william|uk english male|\bmale/i};
const V_FEMALE=/female|zira|samantha|karen|moira|tessa|victoria|susan|hazel|libby|sonia|jenny|aria|\bava\b|laila|mariam|salma|zariyah|hoda|amal|lana|mona|noura|layla/i;
const V_NOVELTY=/compact|eloquence|fred|albert|bad news|bells|boing|bubbles|cellos|whisper|zarvox|trinoids|jester|organ|superstar|wobble|grandma|grandpa|rocko|shelley|reed|sandy|flo\b|junior|ralph|kathy|good news|hysterical/i;
function scoreVoice(v,lg){
  const L=String(v.lang).toLowerCase().replace("_","-");if(!L.startsWith(lg))return -99;let s=1;
  if(/natural|neural|premium|enhanced|online|google|siri/i.test(v.name))s+=4;
  if(V_MALE[lg].test(v.name))s+=3;if(V_FEMALE.test(v.name))s-=1;
  if(lg==="en")s+=L==="en-gb"?3:L==="en-us"?1:0;
  if(lg==="ar")s+=L==="ar-iq"?3:L==="ar-sa"?1:0;
  if(V_NOVELTY.test(v.name))s-=6;
  return s;
}
function voiceList(lg){let vs=[];try{vs=speechSynthesis.getVoices();}catch(e){}return vs.filter(v=>scoreVoice(v,lg)>-99).sort((a,b)=>scoreVoice(b,lg)-scoreVoice(a,lg));}
function pickVoices(){
  if(!window.speechSynthesis)return;
  ["ar","en"].forEach(lg=>{const c=voiceList(lg),pref=LS.get("jv-voice-"+lg);V.voices[lg]=c.find(v=>v.name===pref)||c[0]||null;
    const S=$("#vSel-"+lg);S.innerHTML="";
    if(!c.length){const o=document.createElement("option");o.textContent=lg==="ar"?"ما لگيت صوت عربي بجهازك":"No English voice on this device";S.appendChild(o);S.disabled=true;return;}
    S.disabled=false;c.forEach(v=>{const o=document.createElement("option");o.value=v.name;o.textContent=v.name+" · "+v.lang;S.appendChild(o);});
    S.value=V.voices[lg].name;});
}
if(window.speechSynthesis){pickVoices();speechSynthesis.addEventListener?.("voiceschanged",pickVoices);}
["ar","en"].forEach(lg=>{$("#vSel-"+lg).onchange=e=>{const v=voiceList(lg).find(x=>x.name===e.target.value);if(!v)return;V.voices[lg]=v;LS.set("jv-voice-"+lg,v.name);testVoice(lg);};});
document.querySelectorAll("[data-test]").forEach(b=>b.onclick=()=>{unlockTTS();testVoice(b.dataset.test);});
function testVoice(lg){if(V.state==="thinking")return;killRec();V.mode="off";stopSpeak();V.gen=false;V.said=0;enqueue(lg==="ar"?"هلا، آني جارفس. شلون أگدر أساعدك اليوم؟":"Hello, I'm Jarvis. How can I help you today?");}


</script>
<script>
/* =========================================================
   CONVERSATION
   ========================================================= */
const ERR={bad_pass:"كلمة السر غلط. صححها من الإعدادات.",no_key:"الـrelay ما بي مفتاح API. ضيفه بـScript properties.",bad_key:"مفتاح الـAPI غلط أو منتهي. انسخه من جديد وحطه بـScript properties.",bad_model:"اسم الموديل بخاصية MODEL غلط. امسح الخاصية أو صححها.",
  rate_limited:"Google مشغول أو وصلت الحد اليومي المجاني. جرّب بعد شوية.",refused:"ما گدرت أجاوب على هذا، غيّر الصياغة.",empty:"ما طلع جواب، جرّب مرة ثانية.",
  network:"ما گدرت أوصل للـrelay. تأكد من الرابط والإنترنت.",no_cfg:"لازم تحط رابط الـrelay وكلمة السر بالإعدادات."};
const errMsg=e=>ERR[e&&e.code]||"صار خلل بالاتصال، جرّب مرة ثانية.";
async function ask(signal){
  if(!CFG.url||!CFG.pass)throw {code:"no_cfg"};
  let r;
  try{r=await fetch(CFG.url,{method:"POST",body:JSON.stringify({pass:CFG.pass,system:systemPrompt(),messages:HIST.slice(-30)}),signal});}
  catch(e){throw {code:e&&e.name==="AbortError"?"cancelled":"network"};}
  let d;try{d=await r.json();}catch(e){throw {code:"network"};}
  if(!d.ok)throw {code:d.error};
  return d.text;
}
/* the free Gemini tier is sometimes busy for a few seconds: retry twice before giving up */
async function askRetry(signal){
  for(let i=0;;i++){
    try{return await ask(signal);}
    catch(e){
      if(e.code!=="rate_limited"||i>=2||signal.aborted)throw e;
      setVState("thinking",V.lang==="en"?"Google is busy, trying again…":"Google مشغول، أعيد المحاولة…");
      await new Promise(res=>setTimeout(res,2500*(i+1)));
    }
  }
}

const V_MSG={ar:{idle:"اضغط الهولوگرام أو قول «جارفس»",listening:"أسمعك…",thinking:"يفكر…",speaking:"يتكلم…",standby:"على أهبة الاستعداد… قول «جارفس» وأصحى"},
  en:{idle:"Tap the hologram or say “Jarvis”",listening:"Listening…",thinking:"Thinking…",speaking:"Speaking…",standby:"Standing by… say “Jarvis”"}};
function setVState(s,msg){V.state=s;$("#vState").textContent=msg||V_MSG[V.lang][s];}
function unlockTTS(){
  if(V.unlocked||!window.speechSynthesis)return;V.unlocked=true;
  try{const u=new SpeechSynthesisUtterance(" ");u.volume=0;speechSynthesis.speak(u);}catch(e){}
}
function stopSpeak(){V.spk++;V.q=[];V.talking=false;try{window.speechSynthesis&&speechSynthesis.cancel();}catch(e){}}
function killRec(){if(V.rec){const r=V.rec;V.rec=null;try{r.abort();}catch(e){}}}

function setLang(l){
  V.lang=l;LS.set("jv-lang",l);
  document.querySelectorAll("#vLang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===l));
  if(V.rec){const m=V.mode;killRec();m==="wake"?wakeListen():listen();}else setVState(V.state);
}
document.querySelectorAll("#vLang button").forEach(b=>b.onclick=()=>{unlockTTS();setLang(b.dataset.l);});
function langSwitch(t){
  if(t.trim().split(/\s+/).length>5)return null;
  if(/(english|انكليزي|انگليزي|إنگليزي|انجليزي|إنجليزي)/i.test(t))return "en";
  if(/(arabic|عربي)/i.test(t))return "ar";
  return null;
}
function micBlocked(){
  V.micBlocked=true;V.mode="off";killRec();
  setVState("idle",V.lang==="en"?"The microphone is blocked. Allow it for this site in the browser's site settings, then reload.":"المايك ممنوع. اسمحله من إعدادات الموقع بالمتصفح (أيقونة القفل جنب الرابط) وحدّث الصفحة.");
}

/* one turn of listening: ends on silence, then sends what was said */
function listen(){
  if(!SR){setVState("idle","المتصفح ما يدعم سماع الصوت. استخدم Chrome أو Edge أو Safari، أو اكتب تحت");return;}
  if(V.micBlocked){micBlocked();return;}
  stopSpeak();killRec();
  const r=new SR(),want=V.lang==="en"?"en-US":V.srAr;
  r.lang=want;r.interimResults=true;r.continuous=false;r.maxAlternatives=1;
  let fin="";V.err=null;V.mode="convo";$("#vLive").textContent="";
  r.onresult=e=>{let mid="";for(let i=e.resultIndex;i<e.results.length;i++){const t=e.results[i][0].transcript;if(e.results[i].isFinal)fin+=t;else mid+=t;}$("#vLive").textContent=(fin+mid).trim();holoBump(.22);};
  r.onerror=e=>{V.err=e.error;};
  r.onend=()=>{
    if(V.rec!==r)return;V.rec=null;V.mode="off";
    const err=V.err;V.err=null;
    if(err==="language-not-supported"&&want==="ar-IQ"){V.srAr="ar-SA";listen();return;}
    if(err==="not-allowed"||err==="service-not-allowed"){micBlocked();return;}
    if(err&&err!=="no-speech"&&err!=="aborted"){setVState("idle",V.lang==="en"?"I couldn't hear clearly. Tap the hologram to try again":"ما گدرت أسمع زين، اضغط الهولوگرام وجرّب");return;}
    const t=(fin||$("#vLive").textContent).trim();
    if(t){V.misses=0;voiceSend(t);return;}
    if($("#vLoop").checked){if(++V.misses<3)listen();else{V.misses=0;wakeListen();}}
    else setVState("idle");
  };
  try{r.start();V.rec=r;setVState("listening");}catch(e){V.mode="off";setVState("idle","ما گدرت أشغّل المايك");}
}

/* standby: keep listening quietly for the name */
function wakeListen(){
  if(!SR||V.micBlocked)return;
  killRec();
  const r=new SR();r.lang=V.lang==="en"?"en-US":V.srAr;r.continuous=true;r.interimResults=true;
  let pending=-1,done=false;V.err=null;
  r.onresult=e=>{
    if(done)return;
    for(let i=e.resultIndex;i<e.results.length;i++){
      const res=e.results[i],txt=res[0].transcript,m=txt.match(WAKE_RE);
      if(!m&&pending!==i)continue;
      holoBump(.3);
      if(!res.isFinal){pending=i;continue;}
      done=true;V.rec=null;V.mode="off";try{r.abort();}catch(x){}
      onWake(txt.slice(m?m.index+m[0].length:0).replace(/^[\s,،.!?؟]+/,"").trim());
      return;
    }
  };
  r.onerror=e=>{V.err=e.error;};
  r.onend=()=>{
    if(V.rec!==r)return;V.rec=null;
    const err=V.err;V.err=null;
    if(err==="not-allowed"||err==="service-not-allowed"){micBlocked();return;}
    if(err==="language-not-supported"&&r.lang==="ar-IQ")V.srAr="ar-SA";
    if(V.mode!=="wake")return;
    const quick=Date.now()-V.wakeAt<1500;V.wakeFails=quick?V.wakeFails+1:0;
    if(V.wakeFails>5){V.mode="off";setVState("idle");return;}
    setTimeout(()=>{if(V.mode==="wake"&&!V.rec)wakeListen();},quick?1500:250);
  };
  V.mode="wake";
  try{r.start();V.rec=r;V.wakeAt=Date.now();setVState("standby");}catch(e){V.mode="off";}
}
function onWake(rest){
  if(rest&&rest.split(/\s+/).length>=2){voiceSend(rest);return;}
  say(V.lang==="en"?"Yes?":"نعم؟",()=>listen());
}
function say(text,then){
  stopSpeak();V.gen=false;V.said=1;
  if(V.muted||!window.speechSynthesis){if(then)setTimeout(then,0);return;}
  V.after=then||null;enqueue(text);
}

async function voiceSend(text){
  if(V.state==="thinking"||V.gen)return;
  $("#vLive").textContent=text;
  const sw=langSwitch(text);
  if(sw){setLang(sw);say(sw==="en"?"Of course. Let's talk in English.":"تمام، نحچي عربي.",()=>listen());return;}
  HIST.push({role:"user",content:text});
  const R=$("#vReply");R.innerHTML="";
  stopSpeak();V.said=0;V.gen=true;V.after=null;
  setVState("thinking");V.ctl=new AbortController();
  try{
    const reply=await askRetry(V.ctl.signal);
    HIST.push({role:"assistant",content:reply});saveHist();
    R.innerHTML=md(reply);V.ctl=null;
    feed(reply,true);
  }catch(e){
    HIST.pop();V.gen=false;stopSpeak();V.ctl=null;
    if(e.code==="cancelled"){setVState("idle");return;}
    setVState("idle",errMsg(e));
    if(e.code==="no_cfg"||e.code==="bad_pass")openSettings();
  }
}
/* speak the answer sentence by sentence, each in its own language's voice */
function feed(text,final){
  let end=text.length;
  if(!final){let b=-1;const re=/[.!?؟]+(?=\s)|\n/g;let m;while((m=re.exec(text)))b=m.index+m[0].length;if(b<=V.said)return;end=b;}
  const seg=text.slice(V.said,end);V.said=end;
  if(final)V.gen=false;
  enqueue(seg);
  if(final&&!V.talking&&!V.q.length)afterSpeak();
}
function enqueue(seg){
  if(V.muted||!window.speechSynthesis)return;
  const clean=String(seg).replace(/\[([^\]]*)\]\([^)]*\)/g,"$1").replace(/[#*`_>|]/g,"").replace(/^\s*([-•]|\d+[.)])\s*/gm,"").replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}]/gu,"").trim();
  let last=null;
  (clean.match(/[^.!?؟\n]+[.!?؟]*/g)||[]).forEach(s=>{s=s.trim();if(!s||!/[\p{L}\p{N}]/u.test(s))return;const lg=isAr(s)?"ar":"en";
    if(last&&last.lang===lg&&(last.t+" "+s).length<=180)last.t+=" "+s;else{last={t:s,lang:lg};V.q.push(last);}});
  pump();
}
function pump(){
  if(V.talking||!V.q.length)return;
  const it=V.q.shift(),id=V.spk;V.talking=true;setVState("speaking");
  const vo=V.voices[it.lang];
  if(!vo&&!V.warned[it.lang]){V.warned[it.lang]=true;toast(it.lang==="ar"?"ما لگيت صوت عربي بجهازك، يمكن يطلع النطق غريب":"No English voice on this device");}
  const u=new SpeechSynthesisUtterance(it.t);
  u.lang=vo?vo.lang:(it.lang==="ar"?"ar-SA":"en-GB");if(vo)u.voice=vo;
  u.rate=it.lang==="en"?.95:1.02;u.pitch=it.lang==="en"?.88:.95;
  u.onstart=()=>holoBump(.3);u.onboundary=()=>holoBump(.16);
  let fired=false;
  const done=()=>{if(fired)return;fired=true;clearTimeout(wd);if(id!==V.spk)return;V.talking=false;
    if(V.q.length)pump();else if(!V.gen)afterSpeak();else setVState("thinking");};
  const wd=setTimeout(done,Math.max(6000,it.t.length*150));
  u.onend=done;u.onerror=done;speechSynthesis.speak(u);
}
function afterSpeak(){
  setVState("idle");
  const then=V.after;V.after=null;
  if(then){setTimeout(then,250);return;}
  if($("#vLoop").checked&&SR&&!V.micBlocked&&V.said>0)setTimeout(()=>{if(V.state==="idle"&&!V.gen)listen();},350);
}

$("#vOrb").onclick=()=>{
  unlockTTS();
  if(V.state==="speaking"||V.state==="thinking"){stopSpeak();V.gen=false;V.said=0;V.after=null;if(V.ctl)V.ctl.abort();setVState("idle");return;}
  if(V.state==="listening"){V.rec&&V.rec.stop();return;}
  V.misses=0;listen();
};
$("#vForm").addEventListener("submit",e=>{e.preventDefault();unlockTTS();const t=$("#vInp").value.trim();if(!t)return;$("#vInp").value="";killRec();V.mode="off";stopSpeak();voiceSend(t);});
$("#vInp").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey&&matchMedia("(pointer:fine)").matches){e.preventDefault();$("#vForm").requestSubmit();}});
$("#vMute").onclick=()=>{V.muted=!V.muted;$("#vMute").textContent=V.muted?"الصوت: مطفي":"الصوت: شغّال";if(V.muted&&V.state==="speaking"){stopSpeak();if(!V.gen)afterSpeak();else setVState("thinking");}};
$("#vNew").onclick=()=>{HIST=[];saveHist();$("#vReply").innerHTML="";$("#vLive").textContent="";toast("بدينا محادثة جديدة");};

/* =========================================================
   SETTINGS
   ========================================================= */
function openSettings(){
  $("#sUrl").value=CFG.url;$("#sPass").value=CFG.pass;$("#sAbout").value=CFG.about;$("#sStatus").textContent="";
  pickVoices();$("#setPanel").hidden=false;
}
$("#setBtn").onclick=openSettings;
$("#setPanel").addEventListener("click",e=>{if(e.target.id==="setPanel"&&CFG.url)$("#setPanel").hidden=true;});
$("#setForm").addEventListener("submit",e=>{
  e.preventDefault();
  CFG.url=$("#sUrl").value.trim();CFG.pass=$("#sPass").value;CFG.about=$("#sAbout").value;
  LS.set("jv-url",CFG.url);LS.set("jv-pass",CFG.pass);LS.set("jv-about",CFG.about);
  $("#setPanel").hidden=true;toast("انحفظت الإعدادات");
  if(!V.started)$("#startBtn").hidden=false;
});
$("#sCheck").onclick=async()=>{
  const url=$("#sUrl").value.trim(),st=$("#sStatus");if(!url){st.textContent="حط الرابط أولاً";return;}
  st.textContent="يفحص…";
  try{const r=await fetch(url);const d=await r.json();st.textContent=d.ok?"الـrelay شغّال ✓":"الـrelay رد بخطأ";}
  catch(e){st.textContent="ما گدرت أوصل للرابط. تأكد إنه رابط /exec وإن الوصول Anyone";}
};

/* =========================================================
   START
   ========================================================= */
document.querySelectorAll("#vLang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===V.lang));
holoStart();pickVoices();
const lastA=HIST.filter(t=>t.role==="assistant").slice(-1)[0];if(lastA)$("#vReply").innerHTML=md(lastA.content);
setVState("idle");
/* browsers need one tap before the page may speak or listen */
$("#startBtn").onclick=()=>{
  $("#startBtn").hidden=true;V.started=true;unlockTTS();pickVoices();
  say(V.lang==="en"?"Good to see you. I'm listening.":"هلا بيك، آني جارفس. أسمعك.",()=>listen());
};
if(!CFG.url||!CFG.pass)openSettings();else $("#startBtn").hidden=false;
</script>
